
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史天气记录 - jjk 的天气预报小助手</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        .back-link,
        .city-link,
        .clear-link {
            color: var(--primary);
            text-decoration: none;
        }

        .back-link:hover,
        .city-link:hover,
        .clear-link:hover {
            text-decoration: underline;
        }

        .filter-form {
            display: flex;
            gap: 8px;
            margin: 20px 0 12px;
            flex-wrap: wrap;
        }

        .filter-item{
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
        }

        .filter-form input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            cursor: text;
            width: 100%;
            transition: all 0.2s;
        }

        .filter-form button {
            padding: 10px 20px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            white-space: nowrap;
            height: 41px;
        }

        .filter-form button:hover {
            background-color: var(--primary-dark);
        }

        input:focus,
        button:focus-visible,
        a:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }
        input[type="date"]::selection{
            background-color: #cce5ff;
            color: #000;
        }
        .filter-note {
            margin: 0 0 16px;
            color: #666;
            font-size: 0.95rem;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 480px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        thead th {
            background-color: #f2f2f2;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        tbody tr:hover {
            background-color: #f0f7ff;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #888;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 18px;
            }

            .filter-form {
                flex-direction: column;
            }

            .filter-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>历史查询记录</h1>
            <a class="back-link" href="{{ url_for('index') }}">← 返回首页</a>
        </div>

        <form class="filter-form" method="GET" action="{{ url_for('history') }}">
            <div class="filter-item">
                <label class="sr-only" for="city">按城市筛选</label>
                <input id="city" type="text" name="city" placeholder="城市名，如：崇左" value="{{ current_city or '' }}">
            </div>

            <div class="filter-item">
                <label class="sr-only" for="start_date">开始日期</label>
                <input id="start_date" type="date" name="start_date" value="{{ start_date or '' }}">
            </div>

            <div class="filter-item">
                <label class="sr-only" for="end_date">结束日期</label>
                <input id="end_date" type="date" name="end_date" value="{{ end_date or '' }}">
            </div>
            <button type="submit">搜索</button>
            <a href="{{ url_for('history') }}" class="clear-link" style="margin-bottom: 10px; white-space: nowrap;">重置</a>
        </form>

        {% if current_city %}
        <p class="filter-note">
            正在查看城市：<b>{{ current_city }}</b> ·
            <a class="clear-link" href="{{ url_for('history') }}">显示全部</a>
        </p>
        {% endif %}

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">查询时间</th>
                        <th scope="col">城市</th>
                        <th scope="col">天气</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in records %}
                    <tr>
                        <td>{{ row[0] }}</td>
                        <td>{{ row[1] }}</td>
                        <td>{{ row[2] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="empty">暂无记录</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
