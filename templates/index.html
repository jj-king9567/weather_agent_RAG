<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b1d">
    <title>jjk天气查询站</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080a18;
            --panel: rgba(15, 20, 43, 0.68);
            --panel-strong: rgba(17, 23, 49, 0.84);
            --line: rgba(190, 213, 255, 0.18);
            --text: #f4f6ff;
            --muted: #aab4d3;
            --blue: #82c8ff;
            --purple: #b7a0ff;
            --pink: #ffaddd;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .background,
        .background-shade,
        .aurora,
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .background {
            z-index: -4;
            inset: 0;
            background-image: url("{{ url_for('static', filename='background.jpg') }}");
            background-position: center center;
            background-size: contain;
            background-repeat: no-repeat;
            animation: background-drift 24s ease-in-out infinite alternate;
            will-change: background-position;
        }

        .background-shade {
            z-index: -3;
            background:
                linear-gradient(90deg, rgba(5, 7, 23, 0.78) 0%, rgba(6, 9, 26, 0.2) 37%, rgba(6, 9, 26, 0.14) 62%, rgba(5, 7, 23, 0.72) 100%),
                linear-gradient(180deg, rgba(6, 8, 24, 0.52) 0%, transparent 28%, transparent 55%, rgba(6, 8, 24, 0.88) 100%);
        }

        .aurora {
            z-index: -2;
            opacity: 0.6;
            background:
                radial-gradient(circle at 12% 15%, rgba(107, 142, 255, 0.2), transparent 32%),
                radial-gradient(circle at 88% 24%, rgba(220, 127, 255, 0.16), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(77, 209, 255, 0.12), transparent 42%);
        }

        .particles {
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -24px;
            left: var(--left);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: var(--color);
            box-shadow: 0 0 12px var(--color), 0 0 24px var(--color);
            opacity: 0;
            animation: particle-float var(--duration) linear var(--delay) infinite;
            will-change: transform, opacity;
        }

        .app-shell {
            width: min(100%, 1560px);
            min-height: 100svh;
            margin: 0 auto;
            padding: clamp(20px, 3vw, 42px);
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: clamp(18px, 2.5vw, 34px);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 1px solid rgba(184, 212, 255, 0.28);
            border-radius: 15px;
            color: var(--blue);
            background: linear-gradient(145deg, rgba(127, 182, 255, 0.2), rgba(177, 127, 255, 0.1));
            box-shadow: inset 0 0 20px rgba(145, 185, 255, 0.08), 0 8px 30px rgba(0, 0, 0, 0.18);
        }

        .brand-mark svg {
            width: 27px;
            height: 27px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(19px, 2vw, 25px);
            font-weight: 650;
            letter-spacing: 0.12em;
        }

        .brand p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .history-link {
            min-height: 44px;
            padding: 0 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: #e5ebff;
            background: rgba(14, 19, 42, 0.54);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 14px;
            transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
        }

        .history-link svg {
            width: 17px;
            height: 17px;
            color: var(--blue);
        }

        .history-link:hover {
            transform: translateY(-2px);
            border-color: rgba(130, 200, 255, 0.5);
            background: rgba(32, 40, 75, 0.72);
        }

        .history-link:focus-visible,
        .search-button:focus-visible,
        .city-input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(270px, 340px) minmax(160px, 1fr) minmax(230px, 290px);
            align-items: center;
            gap: clamp(20px, 3vw, 50px);
        }

        .left-rail,
        .right-rail {
            display: grid;
            gap: 16px;
        }

        .glass-panel {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(24, 31, 63, 0.78), var(--panel));
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px) saturate(125%);
            -webkit-backdrop-filter: blur(18px) saturate(125%);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(188, 221, 255, 0.7), transparent);
        }

        .search-panel {
            padding: 20px;
        }

        .panel-kicker {
            margin: 0 0 12px;
            color: var(--blue);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .search-form {
            display: flex;
            gap: 9px;
        }

        .input-wrap {
            position: relative;
            min-width: 0;
            flex: 1;
        }

        .input-wrap svg {
            position: absolute;
            top: 50%;
            left: 13px;
            width: 17px;
            height: 17px;
            color: var(--muted);
            transform: translateY(-50%);
            pointer-events: none;
        }

        .city-input {
            width: 100%;
            height: 45px;
            padding: 0 12px 0 39px;
            border: 1px solid rgba(180, 203, 255, 0.18);
            border-radius: 13px;
            outline: none;
            color: var(--text);
            background: rgba(4, 8, 25, 0.5);
            font-size: 14px;
            transition: border-color 180ms ease, background 180ms ease;
        }

        .city-input::placeholder {
            color: #7f8aaa;
        }

        .city-input:focus {
            border-color: rgba(130, 200, 255, 0.58);
            background: rgba(8, 13, 34, 0.78);
        }

        .search-button {
            height: 45px;
            padding: 0 17px;
            flex: 0 0 auto;
            border: 1px solid rgba(216, 231, 255, 0.25);
            border-radius: 13px;
            color: #10152b;
            background: linear-gradient(135deg, #a6dcff, #c5b2ff);
            box-shadow: 0 8px 24px rgba(116, 166, 255, 0.2);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, filter 180ms ease;
        }

        .search-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-status {
            min-height: 17px;
            margin: 10px 2px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .current-panel {
            padding: 24px;
        }

        .current-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .location {
            margin: 0;
            font-size: 21px;
            font-weight: 650;
            letter-spacing: 0.04em;
        }

        .date-text {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .live-badge {
            padding: 5px 8px;
            flex: 0 0 auto;
            border: 1px solid rgba(130, 200, 255, 0.2);
            border-radius: 999px;
            color: var(--blue);
            background: rgba(130, 200, 255, 0.08);
            font-size: 10px;
            letter-spacing: 0.08em;
        }

        .weather-main {
            min-height: 132px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .temperature {
            margin-left: -4px;
            font-size: clamp(68px, 6vw, 88px);
            font-weight: 250;
            line-height: 1;
            letter-spacing: -0.07em;
            text-shadow: 0 0 38px rgba(150, 201, 255, 0.18);
        }

        .temperature sup {
            margin-left: 4px;
            color: var(--blue);
            font-size: 27px;
            font-weight: 400;
            vertical-align: top;
            letter-spacing: 0;
        }

        .weather-icon {
            width: 92px;
            height: 92px;
            display: grid;
            place-items: center;
            color: #bde5ff;
            filter: drop-shadow(0 0 18px rgba(130, 200, 255, 0.32));
        }

        .weather-icon svg {
            width: 100%;
            height: 100%;
        }

        .weather-description {
            margin: -3px 0 20px;
            color: #e4eaff;
            font-size: 16px;
            letter-spacing: 0.08em;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            padding-top: 17px;
            border-top: 1px solid rgba(190, 213, 255, 0.12);
        }

        .metric {
            min-width: 0;
        }

        .metric + .metric {
            padding-left: 12px;
            border-left: 1px solid rgba(190, 213, 255, 0.1);
        }

        .metric-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 11px;
        }

        .metric-value {
            display: block;
            overflow: hidden;
            color: #f2f5ff;
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .observation-panel {
            padding: 23px;
        }

        .observation-title {
            margin: 0 0 13px;
            font-size: 17px;
            font-weight: 600;
        }

        .observation-text {
            margin: 0;
            color: #c2cbe5;
            font-size: 13px;
            line-height: 1.9;
        }

        .observation-footer {
            margin-top: 20px;
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid rgba(190, 213, 255, 0.12);
            color: var(--muted);
            font-size: 11px;
        }

        .tiny-stars {
            color: var(--pink);
            letter-spacing: 0.18em;
        }

        .forecast-panel {
            padding: 20px clamp(16px, 2vw, 26px) 22px;
            border-radius: 26px;
        }

        .forecast-heading {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .forecast-heading h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .forecast-heading span {
            color: var(--muted);
            font-size: 11px;
        }

        .forecast-list {
            display: grid;
            grid-template-columns: repeat(7, minmax(104px, 1fr));
            gap: 10px;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(130, 200, 255, 0.28) transparent;
        }

        .day-card {
            min-width: 104px;
            padding: 15px 10px 13px;
            border: 1px solid rgba(190, 213, 255, 0.1);
            border-radius: 17px;
            text-align: center;
            background: rgba(7, 11, 29, 0.38);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .day-card:hover {
            transform: translateY(-4px);
            border-color: rgba(130, 200, 255, 0.34);
            background: rgba(34, 43, 79, 0.58);
        }

        .day-card.today {
            border-color: rgba(145, 202, 255, 0.28);
            background: linear-gradient(160deg, rgba(100, 155, 226, 0.2), rgba(118, 91, 181, 0.12));
        }

        .day-name {
            color: #dce5ff;
            font-size: 12px;
        }

        .day-date {
            margin-top: 4px;
            color: #7f8cac;
            font-size: 10px;
        }

        .day-icon {
            width: 40px;
            height: 40px;
            margin: 11px auto 8px;
            color: #b9e1ff;
        }

        .day-icon svg {
            width: 100%;
            height: 100%;
        }

        .day-temp {
            font-size: 13px;
            font-weight: 600;
        }

        .day-temp span {
            margin-left: 6px;
            color: #8792b2;
            font-weight: 400;
        }

        .day-weather {
            margin-top: 6px;
            overflow: hidden;
            color: var(--muted);
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @keyframes background-drift {
            0% { transform: scale(1.04) translate3d(-0.7%, -0.4%, 0); }
            100% { transform: scale(1.09) translate3d(0.8%, 0.6%, 0); }
        }

        @keyframes particle-float {
            0% { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.65); }
            12% { opacity: 0.75; }
            80% { opacity: 0.35; }
            100% { opacity: 0; transform: translate3d(var(--drift), -112vh, 0) scale(1.15); }
        }

        @media (max-width: 1050px) {
            .dashboard {
                grid-template-columns: minmax(270px, 330px) 1fr minmax(215px, 250px);
                gap: 22px;
            }

            .current-panel {
                padding: 21px;
            }

            .observation-panel {
                padding: 20px;
            }
        }

        @media (max-width: 860px) {
            .app-shell {
                display: block;
                padding: 22px;
            }

            .dashboard {
                margin: 28px 0;
                grid-template-columns: minmax(0, 1.25fr) minmax(210px, 0.75fr);
                align-items: start;
            }

            .left-rail,
            .right-rail {
                grid-column: auto;
            }

            .right-rail {
                padding-top: 58px;
            }

            .background-shade {
                background:
                    linear-gradient(90deg, rgba(5, 7, 23, 0.66), rgba(6, 9, 26, 0.2), rgba(5, 7, 23, 0.58)),
                    linear-gradient(180deg, rgba(6, 8, 24, 0.48), transparent 35%, rgba(6, 8, 24, 0.9) 100%);
            }
        }

        @media (max-width: 620px) {
            .app-shell {
                padding: 17px 14px 22px;
            }

            .brand-mark {
                width: 40px;
                height: 40px;
                border-radius: 13px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .brand p {
                display: none;
            }

            .history-link {
                min-height: 40px;
                padding: 0 13px;
                font-size: 12px;
            }

            .dashboard {
                margin: 22px 0;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .left-rail,
            .right-rail {
                width: 100%;
                padding: 0;
            }

            .glass-panel {
                border-radius: 21px;
            }

            .search-panel,
            .current-panel,
            .observation-panel {
                padding: 19px;
            }

            .city-input {
                font-size: 16px;
            }

            .weather-main {
                min-height: 118px;
            }

            .temperature {
                font-size: 74px;
            }

            .weather-icon {
                width: 84px;
                height: 84px;
            }

            .observation-text {
                line-height: 1.75;
            }

            .forecast-panel {
                padding: 18px 13px;
            }

            .forecast-heading {
                padding: 0 4px;
            }

            .forecast-list {
                padding-bottom: 5px;
                grid-template-columns: repeat(7, 100px);
            }

            .day-card {
                min-width: 100px;
            }

            .background {
                background-position: center center;
            }

            .background-shade {
                background: linear-gradient(180deg, rgba(5, 7, 23, 0.6), rgba(6, 9, 26, 0.28) 35%, rgba(5, 7, 23, 0.88) 100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .particles {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <div class="background-shade" aria-hidden="true"></div>
    <div class="aurora" aria-hidden="true"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                        <path d="M12 3a6.5 6.5 0 0 0-6.3 8.1A4.5 4.5 0 0 0 7 19.5h10a4 4 0 0 0 .8-7.9A6.5 6.5 0 0 0 12 3Z"/>
                        <path d="m12 8 .8 2.2L15 11l-2.2.8L12 14l-.8-2.2L9 11l2.2-.8L12 8Z" fill="currentColor" stroke="none"/>
                    </svg>
                </div>
                <div>
                    <h1>jjk的天气网站</h1>
                    <p>Starry Weather Observatory</p>
                </div>
            </div>

            <a class="history-link" href="/history" aria-label="查看历史查询记录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                    <path d="M3 3v5h5M12 7v5l3 2"/>
                </svg>
                历史记录
            </a>
        </header>

        <section class="dashboard" aria-label="天气信息">
            <div class="left-rail">
                <section class="glass-panel search-panel" aria-labelledby="search-title">
                    <p class="panel-kicker" id="search-title"></p>
                    <form class="search-form" id="searchForm">
                        <div class="input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/>
                                <path d="m20 20-4-4"/>
                            </svg>
                            <label for="city" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">城市名称</label>
                            <input class="city-input" type="text" id="city" name="city" placeholder="输入城市，如：崇左" autocomplete="off" required>
                        </div>
                        <button class="search-button" type="submit">查询</button>
                    </form>
                    <p class="search-status" id="searchStatus" aria-live="polite">当前为界面数据</p>
                    <p class="search-status" id="dataSourceNote">由高德平台数据提供</p>
                </section>

                <section class="glass-panel current-panel" aria-labelledby="cityName">
                    <div class="current-heading">
                        <div>
                            <h2 class="location" id="cityName">崇左</h2>
                            <p class="date-text" id="dateText"></p>
                        </div>
                        <span class="live-badge">演示天气</span>
                    </div>

                    <div class="weather-main">
                        <div class="temperature"><span id="temperature">26</span><sup>°C</sup></div>
                        <div class="weather-icon" id="currentIcon" aria-hidden="true"></div>
                    </div>
                    <p class="weather-description" id="weatherDescription">多云转晴</p>

                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">相对湿度</span>
                            <strong class="metric-value" id="humidity">62%</strong>
                        </div>
                    </div>
                </section>
            </div>

            <div aria-hidden="true"></div>

            <aside class="right-rail">
                <section class="glass-panel observation-panel" aria-labelledby="adviceTitle">
                    <p class="panel-kicker">来自jjk的留言</p>
                    <h2 class="observation-title" id="adviceTitle">今日出行笔记</h2>
                    <p class="observation-text" id="adviceText">云层正在慢慢散开，适合出门散步。早晚略凉，记得带一件薄外套。</p>
                    <div class="observation-footer">
                        <span id="updatedTime">刚刚更新</span>
                        <span class="tiny-stars" aria-hidden="true">✦ ˚ ✧</span>
                    </div>
                </section>
            </aside>
        </section>

        <section class="glass-panel" style="padding: 20px; margin-top: 20px; border-radius: 26px;">
            <div class="forecast-heading">
                <h2> 最聪明的jjk助手 (RAG测试1.0)</h2>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="ragQuestion" placeholder="问问知识库，比如：今天哪里不适合出门？" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff;">
                <button id="askBtn" class="search-button" style="height: auto;">提问</button>
            </div>
            <div id="ragAnswer" style="color: #ccc; font-size: 14px; line-height: 1.6; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; display: none;"></div>
        </section>

        <section class="glass-panel forecast-panel" aria-labelledby="forecastTitle">
            <div class="forecast-heading">
                <h2 id="forecastTitle">七日天气预报</h2>
                <span>左右滑动查看更多 · 数据</span>
            </div>
            <div class="forecast-list" id="forecastList"></div>
        </section>
    </main>
    <script>
    "use strict";


    function weatherIcon(type) {
        const sun = '<circle cx="32" cy="32" r="10"/><path d="M32 7v6M32 51v6M7 32h6M51 32h6M14.3 14.3l4.2 4.2M45.5 45.5l4.2 4.2M49.7 14.3l-4.2 4.2M18.5 45.5l-4.2 4.2"/>';
        const smallSun = '<circle cx="40" cy="23" r="9"/><path d="M40 6v5M40 35v5M23 23h5M52 23h5M28 11l4 4M49 32l4 4M52 11l-4 4"/>';
        const cloud = '<path d="M20 45h27a9 9 0 0 0 1-17.9A14 14 0 0 0 21.5 25 10 10 0 0 0 20 45Z"/>';
        const rain = '<path d="M25 51l-2 5M36 51l-2 5M47 51l-2 5"/>';
        const icons = {
            "sun": sun,
            "cloud-sun": smallSun + cloud,
            "cloud": cloud,
            "rain": cloud + rain
        };
        return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + icons[type] + "</svg>";
    }


    const form = document.getElementById("searchForm");
    const cityInput = document.getElementById("city");


    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();
        if (!city) return;

        document.getElementById("searchStatus").textContent = `正在查询 ${city} ...`;

        try {
            const response = await fetch(`/api/weather/${encodeURIComponent(city)}`);
            const data = await response.json();

            if (data.success) {

                document.getElementById("cityName").textContent = data.city;
                document.getElementById("temperature").textContent = data.temperature;
                document.getElementById("weatherDescription").textContent = data.weather;
                document.getElementById("humidity").textContent = data.humidity + "%";


                let iconType = "sun";
                if (data.weather.includes("云")) iconType = "cloud-sun";
                if (data.weather.includes("阴")) iconType = "cloud";
                if (data.weather.includes("雨")) iconType = "rain";
                document.getElementById("currentIcon").innerHTML = weatherIcon(iconType);

                document.getElementById("searchStatus").textContent = "查询成功！";
                cityInput.value = "";
            } else {
                document.getElementById("searchStatus").textContent = `查询失败：${data.message || "未知错误"}`;
            }
        } catch (error) {
            document.getElementById("searchStatus").textContent = "请求出错，请检查后端是否启动！";
            console.error(error);
        }
    });


    function createParticles() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const container = document.getElementById("particles");
        const colors = ["#a9dcff", "#d3b8ff", "#ffd0ec"];
        const count = window.innerWidth < 620 ? 18 : 30;

        for (let index = 0; index < count; index += 1) {
            const particle = document.createElement("span");
            const size = (Math.random() * 2.8 + 1.2).toFixed(1);
            particle.className = "particle";
            particle.style.setProperty("--left", (Math.random() * 100).toFixed(2) + "%");
            particle.style.setProperty("--size", size + "px");
            particle.style.setProperty("--duration", (Math.random() * 13 + 13).toFixed(1) + "s");
            particle.style.setProperty("--delay", (Math.random() * -24).toFixed(1) + "s");
            particle.style.setProperty("--drift", (Math.random() * 120 - 60).toFixed(0) + "px");
            particle.style.setProperty("--color", colors[index % colors.length]);
            container.appendChild(particle);
        }
    }
    createParticles();
    // RAG 问答逻辑
    const askBtn = document.getElementById("askBtn");
    const ragQuestion = document.getElementById("ragQuestion");
    const ragAnswer = document.getElementById("ragAnswer");

    askBtn.addEventListener("click", async () => {
        const question = ragQuestion.value.trim();
        if (!question) return;

        ragAnswer.style.display = "block";
        ragAnswer.textContent = "正在检索知识库...";

        try {
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            if (data.success) {
            // 将换行符替换为 <br> 方便显示
                ragAnswer.innerHTML = data.answer.replace(/\n/g, "<br>");
            } else {
                ragAnswer.textContent = "出错：" + data.answer;
            }
        } catch (error) {
            ragAnswer.textContent = "网络请求失败！";
        }
    });
</script>

</body>
</html>
